<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Consultas Públicas</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-slate-50 font-[Inter]">

<div class="max-w-6xl mx-auto px-4 py-10 space-y-6">

    <header class="bg-white border rounded-2xl px-6 py-4 shadow-md flex items-center gap-4">
        <a th:href="@{/dashboard}" class="text-blue-700 font-semibold">
            <i class="fas fa-arrow-left mr-2"></i> Voltar
        </a>
        <h1 class="text-2xl font-extrabold">Consultas Públicas</h1>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <section class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="font-bold text-lg text-blue-600 mb-4">
                Consultas Abertas
            </h2>

            <div id="lista-consultas"
                 class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm">
            <div id="consulta-detalhe">
                <p class="text-slate-500 text-center">
                    Selecione uma consulta para votar.
                </p>
            </div>

            <div class="flex gap-4 mt-6">
                <button onclick="votarConsulta(consultaSelecionada.id, 'SIM')"
                        class="bg-green-600 text-white px-4 py-2 rounded-lg w-full">
                    Sim
                </button>

                <button onclick="votarConsulta(consultaSelecionada.id, 'NAO')"
                        class="bg-red-600 text-white px-4 py-2 rounded-lg w-full">
                    Não
                </button>
            </div>
        </section>

    </main>
</div>

<script th:src="@{/js/usuario_logado_helper.js}"></script>
<script th:src="@{/js/dashboard_config.js}"></script>
<script th:src="@{/js/consulta_feed.js}"></script>
<script th:src="@{/js/consulta_voto.js}"></script>

</body>
</html>
