<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Relato da Ouvidoria</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/imprensa_feed.css}">
</head>

<body class="feed-bg min-h-screen bg-slate-50 text-slate-900 font-[Inter]">

<div class="max-w-7xl mx-auto px-4 md:px-8 py-10 space-y-6">

    <header class="bg-white border border-slate-200 rounded-2xl px-6 py-4 shadow-md flex flex-col md:flex-row items-center gap-4">
        <div class="flex items-center gap-3 md:flex-1">
            <a href="/relatos_ouvidoria.html" class="inline-flex items-center text-blue-700 hover:underline">
                <i class="fas fa-arrow-left mr-2"></i> Voltar
            </a>
        </div>

        <div class="text-center flex-1">
            <h1 class="text-2xl font-extrabold text-slate-900">Relato da Ouvidoria</h1>
            <p class="text-sm text-slate-500">Visualização e gerenciamento do relato</p>
        </div>

        <div class="md:flex-1"></div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <section class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-6">

            <div>
                <h2 class="text-xl font-bold text-slate-900" th:text="${relato.assunto}">Assunto do Relato</h2>
                <p class="text-sm text-slate-500 mt-1">
                    <i class="fas fa-user mr-1"></i>
                    <span th:text="${relato.autor}">Autor</span>
                </p>
            </div>

            <div class="border-t border-slate-200 pt-4">
                <p class="text-slate-700 whitespace-pre-line leading-relaxed" th:text="${relato.relato}">Texto do relato</p>
            </div>

            <div th:if="${relato.resposta != null}" class="border-t border-slate-200 pt-4 space-y-2">
                <h3 class="font-bold text-green-700 flex items-center gap-2">
                    <i class="fas fa-check-circle"></i>
                    Resposta da Ouvidoria
                </h3>
                <p class="text-slate-700 whitespace-pre-line" th:text="${relato.resposta}">Resposta existente</p>
            </div>

        </section>

        <aside id="secretarioPanel" class="hidden">
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-6">

                <div class="flex flex-col gap-3 rounded-2xl overflow-hidden">
                    <button th:onclick="|marcarResolvido(${relato.id})|"
                            class="w-full inline-flex items-center justify-center bg-green-600 text-white
                                   font-semibold px-5 py-3 rounded-xl shadow hover:bg-green-700 transition">
                        <i class="fas fa-check mr-2"></i> Resolvido
                    </button>

                    <button th:onclick="|arquivarRelato(${relato.id})|"
                            class="w-full inline-flex items-center justify-center bg-red-600 text-white
                                   font-semibold px-5 py-3 rounded-xl shadow hover:bg-red-700 transition">
                        <i class="fas fa-archive mr-2"></i> Arquivar
                    </button>
                </div>

                <div class="mt-6">
                    <h3 class="font-bold text-blue-700 mb-2">Comentário do Secretário</h3>

                    <form id="comentarioForm" class="space-y-2">
                        <textarea id="comentarioText" rows="4"
                                  class="w-full rounded-xl border border-slate-300 p-3
                                         focus:outline-none focus:ring-2 focus:ring-blue-500"
                                  placeholder="Digite seu comentário..."></textarea>
                        <button type="button" th:onclick="|enviarComentario(${relato.id})|"
                                class="w-full inline-flex items-center justify-center
                                       bg-blue-600 text-white font-semibold px-5 py-3 rounded-xl shadow
                                       hover:bg-blue-700 transition">
                            <i class="fas fa-paper-plane mr-2"></i> Enviar Comentário
                        </button>
                    </form>

                    <div id="comentarioExistente" class="bg-slate-100 p-3 rounded-xl whitespace-pre-line">
                    </div>
                </div>

            </div>
        </aside>

    </main>

</div>

<script src="/js/relato_ouvidoria.js"></script>

</body>
</html>
