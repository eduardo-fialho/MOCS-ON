<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relato #<span th:text="${relato.id}"></span></title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="container">
    <h1>Relato <span th:text="${relato.id}"></span></h1>
    <p><strong>Data:</strong> <span th:text="${relato.createdAt}"></span></p>
    <p><strong>Identificação:</strong> <span th:text="${relato.identificacao}"></span></p>
    <p><strong>Nome do relator:</strong> <span th:text="${relato.nomeRelator}"></span></p>
    <p><strong>Comitê do relator:</strong> <span th:text="${relato.comiteRelator}"></span></p>
    <p><strong>Categoria:</strong> <span th:text="${relato.categoriaRelato}"></span></p>

    <h3>Feedback Comitê</h3>
    <p><strong>Condução:</strong> <span th:text="${relato.comiteConducao}"></span></p>
    <p><strong>Respeito:</strong> <span th:text="${relato.comiteRespeito}"></span></p>
    <p><strong>Imparcialidade:</strong> <span th:text="${relato.comiteImparcialidade}"></span></p>
    <p><strong>Apoio:</strong> <span th:text="${relato.comiteApoio}"></span></p>
    <p><strong>Comentários:</strong><br/><span th:utext="${#strings.replace(relato.comiteMensagem, '\n', '<br/>')}"></span></p>

    <h3>Feedback Secretariado</h3>
    <p><strong>Pontos positivos:</strong><br/><span th:utext="${#strings.replace(relato.secretariadoPositivos, '\n', '<br/>')}"></span></p>
    <p><strong>Pontos negativos:</strong><br/><span th:utext="${#strings.replace(relato.secretariadoNegativos, '\n', '<br/>')}"></span></p>
    <p><strong>O que faltou:</strong><br/><span th:utext="${#strings.replace(relato.secretariadoFalta, '\n', '<br/>')}"></span></p>
    <p><strong>Sugestões:</strong><br/><span th:utext="${#strings.replace(relato.secretariadoSugestoes, '\n', '<br/>')}"></span></p>

    <h3>Outros</h3>
    <p><span th:utext="${#strings.replace(relato.outrosMensagem, '\n', '<br/>')}"></span></p>

    <a href="/ouvidoria/admin/list">Voltar</a>
</div>
</body>
</html>
