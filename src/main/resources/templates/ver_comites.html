<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Ver comitês</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body class="bg-gray-100">
    <div class="flex flex-col min-h-screen">
        <header class="bg-white shadow-md z-10 sticky top-0" x-data="profileData()" x-init="loadUserInfo()">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="#"><img src="https://placehold.co/150x50/205395/ffffff?text=MOCS+ON" alt="Logo MOCS ON"
                            class="h-8"></a>
                </div>
                <div class="flex items-center space-x-6">
                    <span class="font-semibold text-gray-700 hidden sm:block">CSNU</span>
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" class="flex items-center space-x-2">
                            <img :src="userAvatar" src="https://placehold.co/40x40/cccccc/ffffff?text=U"
                                data-user-avatar @error="$event.target.src = defaultAvatar" alt="Avatar"
                                class="h-9 w-9 rounded-full border-2 border-mocs-blue">
                            <span class="hidden md:block font-semibold text-gray-700"
                                x-text="userName">Carregando...</span>
                            <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                        <div x-show="open" @click.away="open = false"
                            class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20"
                            style="display: none;">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 border-b">
                                <i class="fas fa-user mr-2"></i> Meu perfil
                            </a>
                            <template x-if="isSecretario">
                                <div>
                                    <a href="/secretariado.html"
                                        class="block px-4 py-2 text-sm text-mocs-blue font-semibold hover:bg-gray-100 border-b">
                                        <i class="fas fa-user-tie mr-2"></i> Área do Secretariado
                                    </a>
                                </div>
                            </template>

                            <a href="/auth/logout"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sair</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow container mx-auto p-4 md:p-6">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Ver comitês</h2>
            <section>
                <table class="min-w-full bg-white shadow-md rounded-lg overflow-hidden">
                    <thead class="bg-mocs-blue text-white">
                        <tr>
                            <th class="py-3 px-6 text-left">Sigla</th>
                            <th class="py-3 px-6 text-left">Nome</th>
                            <th class="py-3 px-6 text-left">Status</th>
                            <th class="py-3 px-6 text-left">Número de Delegados</th>
                            <th class="py-3 px-6 text-left">Descrição</th>
                            <th class="py-3 px-6 text-left">Dashboard</th>
                            <th class="py-3 px-6 text-left">Editar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="comite : ${comites}" class="border-b hover:bg-gray-100">
                            <td class="py-4 px-6" th:text="${comite.sigla}">SIGLA</td>
                            <td class="py-4 px-6" th:text="${comite.nome}">Nome do Comitê</td>
                            <td class="py-4 px-6" th:text="${comite.status}">Status</td>
                            <td class="py-4 px-6" th:text="${comite.numeroDelegados}">0</td>
                            <td class="py-4 px-6" th:text="${comite.descricao}">0</td>

                            <td class="py-4 px-6">
                                <a th:href="@{/dashboard}"><button
                                        class="bg-mocs-blue text-white font-semibold py-2 px-5 rounded-lg hover:bg-opacity-90">
                                        Ver dashboard
                                    </button></a>
                            </td>
                            <td class="py-4 px-6">
                                <a th:href="@{editar/{id}(id=${comite.id})}"><button
                                        class="bg-mocs-blue text-white font-semibold py-2 px-5 rounded-lg hover:bg-opacity-90">
                                        Editar
                                    </button></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script th:src="@{/js/dashboard_config.js}"></script>
    <script th:src="@{/js/profile_data.js}"></script>
    <script th:src="@{/js/announcements_data.js}"></script>
    <script th:src="@{/js/mural_data.js}"></script>
    <script th:src="@{/js/agenda.js}"></script>
</body>

</html>
