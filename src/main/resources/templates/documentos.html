<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Documentos do Comitê</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/documentos.css}">
</head>

<body class="bg-gray-100">
    <div class="flex flex-col min-h-screen">

        <header class="bg-white shadow-md z-10 sticky top-0">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="#"><img src="https://placehold.co/150x50/205395/ffffff?text=MOCS+ON" alt="Logo MOCS ON"
                            class="h-8"></a>
                    <h1 class="text-xl font-bold text-mocs-blue hidden md:block">Documentos do Comitê</h1>
                </div>
                <div class="flex items-center space-x-6">
                    <span class="font-semibold text-gray-700 hidden sm:block">CSNU</span>
                    <div class="relative">
                        <button id="profile-dropdown-button" class="flex items-center space-x-2">
                            <img src="https://placehold.co/40x40/cccccc/ffffff?text=U" alt="Avatar"
                                class="h-9 w-9 rounded-full border-2 border-mocs-blue">
                            <span id="profile-name"
                                class="hidden md:block font-semibold text-gray-700">Carregando...</span>
                            <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                        <div id="profile-dropdown-menu"
                            class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20"
                            style="display: none;">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 border-b">
                                <i class="fas fa-user mr-2"></i> Meu perfil
                            </a>
                            <a href="/auth/logout"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sair</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow container mx-auto p-4 md:p-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <div class="lg:col-span-2 flex flex-col gap-6">

                    <div class="bg-white p-4 rounded-xl shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex flex-col sm:flex-row gap-4 flex-1">
                            <input type="text" id="search-input" placeholder="Buscar por título, autor, tipo..."
                                class="w-full sm:flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">

                            <select id="type-select"
                                class="w-full sm:w-auto p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">
                                <option value="">Todos os Tipos</option>
                                <option value="Proposta de Resolução">Proposta de Resolução (PR)</option>
                                <option value="Documento de Trabalho">Documento de Trabalho (DT)</option>
                                <option value="Emenda">Emenda</option>
                                <option value="Nota">Nota</option>
                            </select>

                            <select id="status-select"
                                class="w-full sm:w-auto p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">
                                <option value="">Todos os Status</option>
                                <option value="Enviado">Enviado</option>
                                <option value="Em Votação">Em Votação</option>
                                <option value="Aprovado">Aprovado</option>
                                <option value="Reprovado">Reprovado</option>
                                <option value="Corrigir">Corrigir</option>
                            </select>
                        </div>

                        <a th:href="@{/submissao_documentos.html}"
                            class="bg-mocs-orange text-white font-semibold py-2 px-4 rounded-lg hover:bg-opacity-90 transition duration-150 flex items-center">
                            <i class="fas fa-plus mr-2"></i> Novo Documento
                        </a>
                    </div>

                    <div class="bg-white p-6 rounded-xl shadow-lg flex-1">
                        <h2 class="text-2xl font-bold text-mocs-blue mb-4">Documentos Enviados</h2>
                        <div class="space-y-3 custom-scrollbar max-h-[70vh] overflow-y-auto" id="document-list-container">
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-1 flex flex-col gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-lg sticky top-20">
                        <h2 class="text-xl font-bold text-mocs-orange mb-4">Detalhes do Documento</h2>
                        <div id="details-view-container">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/documentos.js}"></script>
</body>

</html>
