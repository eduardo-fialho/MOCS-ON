<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <style>

    </style>
</head>

<body class="login-bg flex items-center justify-center">

<main class="w-full max-w-md mx-auto p-6">
    <section role="form" aria-labelledby="titulo-login"
             class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-lg border border-white/50">

        <header class="text-center mb-8">
            <img src="https://placehold.co/150x50/205395/ffffff?text=MOCS+ON"
                 alt="Logo MOCS ON" class="mx-auto mb-4">

            <h1 id="titulo-login" class="text-2xl font-bold text-mocs-blue">MOCS ON</h1>
            <p class="text-gray-600">Plataforma do Modelo de Comitês Simulados do CEFET-MG</p>
        </header>

        <div th:if="${error != null and !#strings.isEmpty(error)}"
             class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4"
             role="alert"
             th:text="${error}">
            Erro ao fazer login.
        </div>

        <div    th:if="${success != null and !#strings.isEmpty(success)}"
             class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4"
             role="alert"
             th:text="${success}">
            Conta criada com sucesso!
        </div>

        <form th:action="@{/auth/login}" method="post" aria-describedby="titulo-login">

            <div class="mb-4 relative">
                <label for="email" class="sr-only">Email</label>
                <i class="fa fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
                   aria-hidden="true"></i>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Email"
                    required
                    autocomplete="email"
                    th:value="${email != null ? email : ''}"
                    class="form-input w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg
                           focus:ring-2 focus:ring-mocs-blue focus:outline-none transition-all">
            </div>

            <div class="mb-6 relative">
                <label for="password" class="sr-only">Senha</label>
                <i class="fa fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
                   aria-hidden="true"></i>

                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    placeholder="Senha"
                    autocomplete="current-password"
                    class="form-input w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg
                           focus:ring-2 focus:ring-mocs-blue focus:outline-none transition-all">

                <button type="button" id="togglePassword"
                        aria-label="Mostrar ou ocultar senha"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-mocs-blue">
                    <i class="fa fa-eye" id="eye-icon"></i>
                </button>
            </div>

            <button type="submit"
                    class="w-full bg-mocs-blue text-white font-semibold py-3 rounded-lg
                           hover:bg-opacity-90 transition-all duration-300 transform hover:scale-105">
                Entrar
            </button>

            <nav class="text-center text-sm text-gray-600 mt-4">
                <a href="/auth/forgot-password" class="hover:text-mocs-blue">Esqueceu sua senha?</a>
                <span class="mx-2 text-gray-300">|</span>
                <a href="/" class="hover:text-mocs-blue">Acessar como visitante</a>
            </nav>
        </form>
    </section>

    <footer class="text-center mt-8 text-white drop-shadow">
        <p class="text-sm">&copy; 2024 MOCS CEFET-MG. Todos os direitos reservados.</p>

        <div class="flex justify-center space-x-4 mt-4">
            <a href="https://www.instagram.com/mocscefet/" target="_blank" rel="noopener" class="social-link" aria-label="Instagram MOCS">
                <i class="fab fa-instagram fa-lg"></i>
            </a>

            <a href="https://twitter.com" target="_blank" rel="noopener" class="social-link" aria-label="Twitter">
                <i class="fab fa-twitter fa-lg"></i>
            </a>

            <a href="https://facebook.com" target="_blank" rel="noopener" class="social-link" aria-label="Facebook">
                <i class="fab fa-facebook-f fa-lg"></i>
            </a>
        </div>
    </footer>
</main>

<script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    togglePassword.addEventListener('click', () => {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";

        eyeIcon.classList.toggle("fa-eye");
        eyeIcon.classList.toggle("fa-eye-slash");
    });
</script>

</body>
</html>
