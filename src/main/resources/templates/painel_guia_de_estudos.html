<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>MOCS ON - Guias de Estudo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="max-w-7xl mx-auto px-6 py-10 space-y-6">

        <header
            class="bg-white border border-slate-200 rounded-2xl px-6 py-4 shadow-md flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
                <a id="btn-voltar" th:href="@{/secretariado.html}"
                    class="inline-flex items-center text-blue-700 hover:underline">
                    <i class="fas fa-arrow-left mr-2"></i> Voltar
                </a>
                <span class="hidden md:inline-flex text-slate-300">|</span>
                <span class="text-lg font-bold tracking-tight text-blue-700">MOCS ON</span>
            </div>

            <div class="text-center md:flex-1">
                <h1 class="text-2xl font-extrabold text-slate-900">Guias de Estudo</h1>
            </div>

            <div class="flex items-center gap-3 relative">
                <div class="relative">
                    <button id="user-dropdown-btn"
                        class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-full px-3 py-2">
                        <img id="user-avatar" src="" alt="Avatar" class="h-9 w-9 rounded-full border border-slate-200">
                        <span id="user-name" class="hidden md:block font-semibold text-slate-900">Carregando...</span>
                        <i class="fas fa-chevron-down text-xs text-slate-400"></i>
                    </button>

                    <div id="user-dropdown"
                        class="absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-xl py-2 z-20 hidden">
                        <a href="/profile" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                            <i class="fas fa-user mr-2"></i> Meu perfil
                        </a>
                        <a id="secretariado-link" th:href="@{/secretariado.html}"
                            class="block px-4 py-2 text-sm text-blue-700 font-semibold hover:bg-slate-50"
                            style="display:none;">
                            <i class="fas fa-user-tie mr-2"></i> Área do Secretariado
                        </a>
                        <a th:href="@{/auth/logout}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Sair</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="lg:col-span-2 space-y-4">
                <div class="bg-white p-4 rounded-xl shadow flex gap-3">
                    <input id="search-input" type="text" placeholder="Buscar por título ou autor..."
                        class="flex-1 px-4 py-3 border rounded-xl">
                    <a id="btn-novo-guia" th:href="@{/cadastrar_guia.html}"
                        class="inline-flex items-center bg-amber-500 text-white font-semibold px-5 py-3 rounded-xl shadow hover:bg-amber-600 transition">
                        <i class="fas fa-plus mr-2"></i> Novo Guia de Estudos
                    </a>
                </div>

                <div class="bg-white p-6 rounded-xl shadow">
                    <h2 class="text-xl font-bold mb-4">Guias disponíveis</h2>
                    <div id="guias-list" class="space-y-3 max-h-[70vh] overflow-y-auto">
                        Carregando...
                    </div>
                </div>
            </section>

            <aside>
                <div id="detalhes-container" class="bg-white p-6 rounded-xl shadow sticky top-6 hidden">
                    <h2 class="text-lg font-bold text-blue-700 mb-4">Detalhes do Guia</h2>
                    <div id="guia-detalhes" class="space-y-2">
                        <p><strong>Título:</strong> <span id="detalhe-titulo">-</span></p>
                        <p><strong>Autor:</strong> <span id="detalhe-autor">-</span></p>
                        <p><strong>Comitê:</strong> <span id="detalhe-comite">-</span></p>
                        <button id="btn-visualizar"
                            class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-xl hover:bg-blue-700 transition mb-2">
                            <i class="fas fa-eye mr-2"></i> Visualizar Guia
                        </button>
                        <button id="btn-arquivar"
                            class="w-full bg-red-600 text-white font-bold py-2 px-4 rounded-xl hover:bg-red-700 transition">
                            <i class="fas fa-archive mr-2"></i> Arquivar Guia
                        </button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script th:src="@{/js/painel_guia_de_estudos.js}"></script>
    <script th:src="@{/js/dashboard_config.js}"></script>
    <script th:src="@{/js/profile_data.js}"></script>
</body>

</html>
