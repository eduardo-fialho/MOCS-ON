<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Criar um comitê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/comite-ui.css}">
</head>

<body class="bg-gray-100">
    <div class="flex flex-col min-h-screen">
        <header class="bg-white shadow-md z-10 sticky top-0">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a th:href="@{/dashboard.html}"><img src="https://placehold.co/150x50/205395/ffffff?text=MOCS+ON" alt="Logo MOCS ON"
                            class="h-8"></a>
                </div>
                <div class="flex items-center space-x-6">
                    <span class="font-semibold text-gray-700 hidden sm:block">CSNU</span>
                    <div class="relative">
                        <button id="user-dropdown-btn" class="flex items-center space-x-2">
                            <img id="user-avatar" data-user-avatar src="https://placehold.co/40x40/cccccc/ffffff?text=U"
                                alt="Avatar" class="h-9 w-9 rounded-full border-2 border-mocs-blue">
                            <span id="user-name"
                                class="hidden md:block font-semibold text-gray-700">Carregando...</span>
                            <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                        <div id="user-dropdown"
                            class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20 hidden">
                            <a th:href="@{/profile}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 border-b">
                                <i class="fas fa-user mr-2"></i> Meu perfil
                            </a>
                            <a id="secretariado-link" th:href="@{/secretariado.html}"
                                class="block px-4 py-2 text-sm text-mocs-blue font-semibold hover:bg-gray-100 border-b"
                                style="display:none">
                                <i class="fas fa-user-tie mr-2"></i> Área do Secretariado
                            </a>
                            <a th:href="@{/auth/logout}"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sair</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow container mx-auto p-4 md:p-6">
            <form action="/comite/salvar" method="post"
                class="bg-white p-6 rounded-xl shadow-lg max-w-lg mx-auto">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">Criar Novo Comitê</h2>
                <article class="mb-4">
                    <label for="nomeComite" class="block text-gray-700 font-semibold mb-2">Nome do Comitê</label>
                    <input type="text" id="nomeComite" name="nome" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">
                </article>
                <article class="mb-4">
                    <label for="siglaComite" class="block text-gray-700 font-semibold mb-2">Sigla</label>
                    <input type="text" id="siglaComite" name="sigla" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">
                </article>
                <article class="mb-4">
                    <label for="statusComite" class="block text-gray-700 font-semibold mb-2">Status</label>
                    <select id="statusComite" name="status" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">
                        <option th:each="s : ${T(com.mocs_on.domain.Comite.StatusComite).values()}"
                            th:value="${s}" th:text="${s}">EM_ANDAMENTO</option>
                    </select>
                </article>
                <article class="mb-4">
                    <label for="numeroDelegados" class="block text-gray-700 font-semibold mb-2">Número de delegados</label>
                    <input type="number" id="numeroDelegados" min="1" name="numeroDelegados" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue">
                </article>
                <article class="mb-4">
                    <label for="descricaoComite" class="block text-gray-700 font-semibold mb-2">Descrição</label>
                    <textarea id="descricaoComite" name="descricao" rows="4" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-mocs-blue"></textarea>
                </article>
                <button type="submit"
                    class="bg-mocs-blue text-white font-semibold py-2 px-5 rounded-lg hover:bg-opacity-90">Criar
                    Comitê</button>
            </form>
        </main>
    </div>

    <script th:src="@{/js/dashboard_config.js}"></script>
    <script th:src="@{/js/profile_data.js}"></script>
</body>

</html>
