<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Editar Matéria</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-gray-100 font-[Inter]">
<div class="flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-white shadow-md z-10 sticky top-0">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="/dashboard">
                    <img src="https://placehold.co/150x50/205395/ffffff?text=MOCS+ON"
                         alt="Logo MOCS ON" class="h-8">
                </a>
                <h1 class="text-xl font-bold text-gray-700 hidden md:block">
                    Editar Matéria
                </h1>
            </div>

            <a th:href="@{/imprensa}"
               class="text-gray-600 hover:text-blue-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-100">
                <i class="fas fa-arrow-left mr-2"></i> Voltar
            </a>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-grow container mx-auto p-4 md:p-6">
        <div class="bg-white p-6 rounded-xl shadow-lg max-w-3xl mx-auto">

            <h2 class="text-2xl font-bold text-blue-700 mb-6">
                Editar Matéria
            </h2>
            <p>Ao editar esta matéria, ela retornará para revisão.</p>

            <form id="form-materia"
                  th:action="@{'/materias/' + ${materia.id}}"
                  method="post"
                  enctype="multipart/form-data"
                  class="space-y-5">

                <!-- TÍTULO -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        Título <span class="text-red-500">*</span>
                    </label>
                    <input type="text"
                           name="titulo"
                           th:value="${materia.titulo}"
                           required
                           class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600">
                </div>

                <!-- LEAD -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        Lead <span class="text-red-500">*</span>
                    </label>
                    <textarea name="lead"
                              rows="3"
                              required
                              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600"
                              th:text="${materia.lead}"></textarea>
                </div>

                <!-- TEXTO -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        Conteúdo <span class="text-red-500">*</span>
                    </label>
                    <textarea name="texto"
                              rows="8"
                              required
                              class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-600"
                              th:text="${materia.texto}"></textarea>
                </div>

                <!-- IMAGEM ATUAL -->
                <div th:if="${materia.imagem != null}">
                    <p class="text-sm font-semibold text-gray-700 mb-2">Imagem atual</p>
                    <img th:src="@{'/imprensa/materias/' + ${materia.id} + '/imagem'}"
                         class="rounded-lg border max-h-60">
                </div>

                <!-- NOVA IMAGEM -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        Substituir imagem (opcional)
                    </label>
                    <input type="file"
                           name="imagem"
                           accept="image/png"
                           onchange="validarImagem(this)"
                           class="w-full p-3 border rounded-lg">
                    <p class="text-xs text-gray-500 mt-1">
                        Tipo aceito: PNG
                    </p>
                </div>


                <button type="submit"
                        class="w-full bg-blue-700 text-white font-semibold py-3 rounded-lg
                               hover:bg-blue-800 transition flex justify-center items-center">
                    <i class="fas fa-save mr-2"></i>
                    Salvar Alterações
                </button>
            </form>

            <div id="message-area"
                 class="mt-4 text-sm font-medium p-3 rounded-lg text-center hidden">
            </div>

        </div>
    </main>

</div>

<script th:src="@{/js/editar_materia.js}"></script>
</body>
</html>
