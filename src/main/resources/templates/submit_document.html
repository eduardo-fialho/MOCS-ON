<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Submeter Documento - Comitê</title>
</head>
<body>
    <h1>Submeter Documento ao Comitê</h1>
    <form method="post" enctype="multipart/form-data" th:action="@{/documentos/upload}">
        <label for="file">Escolha o arquivo (PDF, DOCS, OTD, PNG):</label>
        <input type="file" id="file" name="file" required />
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
