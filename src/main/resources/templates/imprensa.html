<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCS ON - Imprensa</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 font-[Inter]">

    <div class="max-w-7xl mx-auto px-4 md:px-8 py-10 space-y-6">

        <header class="bg-white border border-slate-200 rounded-2xl px-6 py-4 shadow-md
                   flex flex-col md:flex-row md:items-center md:justify-between gap-4">

            <div class="flex items-center gap-3">
                <a th:href="@{/secretariado.html}" class="inline-flex items-center text-blue-700 hover:underline">
                    <i class="fas fa-arrow-left mr-2"></i> Voltar
                </a>
                <span class="hidden md:inline-flex text-slate-300">|</span>
            </div>

            <div class="text-left md:text-left">
                <h1 class="text-2xl font-extrabold text-slate-900">Gestão da Imprensa</h1>
                <p class="text-sm text-slate-500">
                    Criação, edição e aprovação de matérias oficiais.
                </p>
            </div>

            <div class="flex items-center gap-3">
                <div class="relative">
                    <button class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200
                               border border-slate-200 rounded-full px-3 py-2">
                        <img src="https://placehold.co/40x40/94a3b8/ffffff?text=U" alt="Avatar"
                            class="h-9 w-9 rounded-full border border-slate-200">
                        <span class="hidden md:block font-semibold text-slate-900">
                            Usuário
                        </span>
                        <i class="fas fa-chevron-down text-xs text-slate-400"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <section class="lg:col-span-2 space-y-4">
                <div x-data="{ aba: 'todas' }"
                    class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-6">

                    <!-- MENU DE ABAS -->
                    <div class="flex gap-2 border-b border-slate-200 pb-3">
                        <button
                            @click="aba = 'todas'"
                            :class="aba === 'todas'
                                ? 'border-blue-600 text-blue-600'
                                : 'border-transparent text-slate-500 hover:text-slate-700'"
                            class="px-4 py-2 font-semibold border-b-2 transition">
                            Todas
                        </button>

                        <button
                            @click="aba = 'pendentes'"
                            :class="aba === 'pendentes'
                                ? 'border-amber-500 text-amber-600'
                                : 'border-transparent text-slate-500 hover:text-slate-700'"
                            class="px-4 py-2 font-semibold border-b-2 transition">
                            Pendentes
                        </button>

                        <button
                            @click="aba = 'aprovadas'"
                            :class="aba === 'aprovadas'
                                ? 'border-green-600 text-green-600'
                                : 'border-transparent text-slate-500 hover:text-slate-700'"
                            class="px-4 py-2 font-semibold border-b-2 transition">
                            Aprovadas
                        </button>
                    </div>

                    <!-- CONTEÚDO DAS ABAS -->

                    <div x-show="aba === 'todas'" x-transition>
                        <h2 class="text-lg font-bold text-blue-600 mb-3">
                            Matérias Cadastradas
                        </h2>
                        <div id="lista-todas"
                            class="space-y-3 max-h-[40vh] overflow-y-auto pr-2">
                        </div>
                    </div>

                    <div x-show="aba === 'pendentes'" x-transition>
                        <h2 class="text-lg font-bold text-amber-600 mb-3">
                            Pendentes de Aprovação
                        </h2>
                        <div id="lista-pendentes"
                            class="space-y-3 max-h-[40vh] overflow-y-auto pr-2">
                        </div>
                    </div>

                    <div x-show="aba === 'aprovadas'" x-transition>
                        <h2 class="text-lg font-bold text-green-600 mb-3">
                            Matérias Aprovadas
                        </h2>
                        <div id="lista-aprovadas"
                            class="space-y-3 max-h-[40vh] overflow-y-auto pr-2">
                        </div>
                    </div>
                </div>
            </section>

            <aside class="lg:col-span-1">
                <div id="details-view-container"
                    class="text-slate-700 text-sm space-y-4">
                    <p class="text-slate-500">
                        Selecione uma matéria para ver os detalhes.
                    </p>
                </div>

                <div class="rounded-2xl p-1 mt-8 shadow-sm
                            flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                        <a th:href="@{/materias/nova}" class="inline-flex items-center bg-blue-600 text-white
                            font-semibold px-5 py-3 rounded-xl shadow
                            hover:bg-blue-700 transition">
                            <i class="fas fa-plus mr-2"></i> Nova Matéria
                        </a>
                    </div>
            </aside>

        </main>
    </div>

    <script th:src="@{/js/imprensa.js}"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>

</html>
