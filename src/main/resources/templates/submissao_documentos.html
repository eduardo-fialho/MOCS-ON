<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar Documento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a2e0e9e4c1.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .text-mocs-blue { color: #205395; }
    .bg-mocs-blue { background-color: #205395; }
    .bg-mocs-orange { background-color: #f3a13b; }
    .text-mocs-orange { color: #f3a13b; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 text-slate-900">
  <div class="max-w-4xl mx-auto px-4 md:px-8 py-10 space-y-6">
    <header class="bg-white/95 backdrop-blur border border-slate-200 rounded-2xl px-6 py-4 shadow-lg flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <a th:href="@{/documentos.html}" class="inline-flex items-center text-mocs-blue hover:underline">
          <i class="fas fa-arrow-left mr-2"></i> Voltar
        </a>
        <span class="hidden md:inline-flex text-slate-300">|</span>
        <a th:href="@{/}" class="text-lg font-bold tracking-tight">MOCS ON</a>
      </div>
      <div class="text-center md:text-left">
        <h1 class="text-2xl font-extrabold text-slate-900">Enviar Documento</h1>
        <p class="text-sm text-slate-500">Preencha os dados e anexe o arquivo.</p>
      </div>
    </header>

    <main>
      <div class="bg-white/95 backdrop-blur border border-slate-200 rounded-2xl p-6 shadow-xl space-y-5">
        <form id="upload-form" class="space-y-5" enctype="multipart/form-data">
          <div class="grid md:grid-cols-2 gap-4">
            <div class="space-y-1">
              <label for="doc-title" class="block text-sm font-semibold text-slate-700">Título *</label>
              <input id="doc-title" name="title" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-mocs-orange focus:outline-none" placeholder="Ex.: Regulamento do Comitê">
            </div>
            <div class="space-y-1">
              <label for="doc-author" class="block text-sm font-semibold text-slate-700">Autor *</label>
              <input id="doc-author" name="author" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-mocs-orange focus:outline-none" placeholder="Nome do responsável">
            </div>
          </div>

          <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-700">Arquivo *</label>
            <div class="w-full rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 px-4 py-4 flex items-center gap-3 hover:border-mocs-orange/70 transition">
              <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-mocs-orange/10 text-mocs-orange">
                <i class="fas fa-file-upload"></i>
              </div>
              <input id="doc-file" type="file" name="file" required class="flex-1 text-sm text-slate-700 focus:outline-none">
            </div>
            <p class="text-xs text-slate-500">Tamanho máximo: 10 MB. Formato aceito: PDF.</p>
          </div>

          <div class="flex gap-3 items-center">
            <button type="submit" class="inline-flex items-center bg-mocs-blue text-white font-semibold px-5 py-3 rounded-xl shadow hover:bg-blue-700 transition">
              <i class="fas fa-cloud-upload-alt mr-2"></i> Enviar
            </button>
            <span id="upload-status" class="text-sm font-medium text-slate-600"></span>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script th:src="@{/js/submissao_documentos.js}"></script>
  <script th:src="@{/js/dashboard_config.js}"></script>
  <script th:src="@{/js/profile_data.js}"></script>
</body>
</html>
